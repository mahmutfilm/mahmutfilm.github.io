<!DOCTYPE html>
<html lang="tr">
<head>

    <title>MAHMUT FILM</title>
    <style>

        .navbar { padding: 15px 5%; background: #000; border-bottom: 2px solid #e50914; position: fixed; width: 100%; z-index: 100; }
        .logo { color: #e50914; font-size: 30px; font-weight: 900; }
        .container { padding: 100px 5% 50px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: #111; border-radius: 8px; overflow: hidden; position: relative; text-align: center; padding-bottom: 10px; }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .badge { position: absolute; top: 5px; right: 5px; background: #e50914; font-size: 10px; padding: 3px 6px; font-weight: bold; border-radius: 3px; }
        .play-btn { background: #fff; color: #000; border: none; padding: 8px 15px; font-weight: bold; margin-top: 10px; cursor: pointer; border-radius: 4px; width: 90%; }
        h2 { color: #e50914; margin-bottom: 20px; }
    </style>
</head>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHMUT FILM</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .navbar { padding: 20px 5%; position: fixed; width: 100%; z-index: 1000; }
        .logo { color: #e50914; font-size: 35px; font-weight: 900; }
        .hero { height: 70vh; background: linear-gradient(to top, #000, transparent), url('https://image.tmdb.org/t/p/original/6DrHO1oPABT6S7G9SotS7STI94K.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 5%; }
        .hero h1 { font-size: 3rem; margin: 0; }
        .play-btn { background: #fff; color: #000; padding: 12px 30px; border: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .row { padding: 20px 5%; }
        .posters { display: flex; gap: 15px; overflow-x: auto; }
        .posters img { width: 160px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="navbar"><div class="logo">M</div></div>
    <div class="hero">
        <div>
            <h1>Batman</h1>
            <button class="play-btn">Oynat</button>
        </div>
    </div>
    <div class="row">
        <h2>Aksiyon Filmleri</h2>
        <div class="posters">
            <img src="https://image.tmdb.org/t/p/w500/q6720Bocp9HogSfuT9o90btTguM.jpg">
            <img src="https://image.tmdb.org/t/p/w500/7WsyChQLEUX9Iu0UvunMG9AfsEA.jpg">
            <img src="https://image.tmdb.org/t/p/w500/8tZYtuWezp8J70U1CN0o3x0o0XF.jpg">
        </div>
    </div>
</body>
</html>

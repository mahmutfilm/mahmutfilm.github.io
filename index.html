<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHMUT FILM</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .navbar { padding: 20px 5%; background: rgba(0,0,0,0.8); position: fixed; width: 90%; z-index: 100; display: flex; align-items: center; }
        .logo { color: #e50914; font-size: 38px; font-weight: bold; }
        .container { padding: 100px 5% 50px; }
        .row h2 { font-size: 1.4rem; color: #fff; margin-bottom: 20px; }
        .posters { display: flex; gap: 15px; overflow-x: scroll; padding: 10px 0; }
        .posters::-webkit-scrollbar { display: none; }
        .card { min-width: 160px; position: relative; transition: transform 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; border-radius: 4px; border: 1px solid #333; }
        .tag { position: absolute; bottom: 8px; left: 8px; background: #e50914; color: #fff; padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="navbar"><div class="logo">M</div></div>
    <div class="container">
        <div class="row">
            <h2>PopC<ler Filmler</h2>
            <div class="posters">
                <!-- Film 1 -->
                <div class="card">
                    <img src="https://image.tmdb.org/t/p/w500/6DrHO1oPABT6S7G9SotS7STI94K.jpg">
                    <div class="tag">4K DUBLAJ</div>
                </div>
                <!-- Film 2 -->
                <div class="card">
                    <img src="https://image.tmdb.org/t/p/w500/q6720Bocp9HogSfuT9o90btTguM.jpg">
                    <div class="tag">HD TC            </div>
        </div>
    </div>
</body>
</html>
